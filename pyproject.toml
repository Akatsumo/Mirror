[project]
name = "mirror"
version = "2.0.0"
description = "Async Telegram mirror/leech bot (Pyrogram + Motor)"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["downloads", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "BLE", "N", "C4", "PIE", "RET"]
ignore = ["N999", "RUF001", "RUF002", "RUF003", "RUF012", "B008", "ASYNC230", "ASYNC240", "ASYNC109", "SIM105", "RET505"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
