name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends p7zip-full ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m compileall -q Mirror tests update.py
      - run: python -c "import Mirror.__main__; from Mirror import modules; modules.load()"
      - run: pytest
